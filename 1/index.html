<!DOCTYPE html>
<html>
<head>
    <title>Project 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cedarville Cursive', cursive;
            margin: 20px;
            background-image: url('../home-media/paper-texture.jpg');
            background-repeat: repeat;
        }
        figcaption,
        a,
        h2 {
            font-family: 'Josefin Sans', sans-serif;
        }
        img {
            max-width: 400px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 800px;
        }
        figure {
            margin-left: 0;
            margin-right: 0;
        }
        .row figure {
            margin: 0;
            flex: 1;
        }
        .row img {
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Project 0: Becoming Friends With Your Camera</h1>
    <p><a href="../index.html">Back to home</a></p>

    <h2>Part 1: Selfie: The Wrong Way vs. The Right Way</h2>
    <div class="row">
        <figure>
            <img src="./media/cs180-part1-image1.JPG" alt="Close up, distorted selfie">
            <figcaption>Close up, distorted selfie</figcaption>
        </figure>
        <figure>
            <img src="./media/cs180-part1-image2.JPG" alt="Zoomed in selfie">
            <figcaption>Zoomed in selfie</figcaption>
        </figure>
    </div>

    <h2>Part 2: Architectural Perspective Compression</h2>
    <div class="row">
        <figure>
            <img src="./media/cs180-part2-image1.JPG" alt="Zoomed in picture of Doe Library">
            <figcaption>Zoomed in picture of Doe Library</figcaption>
        </figure>
        <figure>
            <img src="./media/cs180-part2-image2.JPG" alt="Doe Library without zoom">
            <figcaption>Doe Library without zoom</figcaption>
        </figure>
    </div>

    <h2>Part 3: The Dolly Zoom</h2>
    <figure>
        <img src="./media/dollyzoom.gif" alt="Dolly zoom animation">
        <figcaption>Dolly zoom animation</figcaption>
    </figure>
</body>
</html>
